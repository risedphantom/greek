[project]
name = "greekpipe"
version = "0.1.0"
description = "Turns a Telegram Greek-course group into a static site"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "python-dotenv",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greekpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
