<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ελληνικά · Группа 5</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
</head>
<body>
  <header class="top">
    <strong class="brand">Ελληνικά · Группа 5</strong>
    <nav class="tabs">
      <a class="tab" id="tab-lessons" href="#/lessons">Уроки</a>
      <a class="tab" id="tab-dictionary" href="#/dictionary">Словарь</a>
    </nav>
    <span class="updated" id="updated"></span>
  </header>

  <main id="view-lessons" class="body lessons">
    <nav class="pane toc" id="toc-pane" aria-label="Оглавление грамматики">
      <input type="search" id="search" class="search" placeholder="Поиск: σε, артикль, είμαι…" aria-label="Поиск по грамматике">
      <div id="topic-list"></div>
    </nav>
    <section class="pane" id="grammar-pane">
      <p class="hint" id="article-hint">Выберите тему слева</p>
      <article id="article" class="article" hidden></article>
    </section>
    <section class="pane" id="hw-pane">
      <input type="search" id="hw-search" class="search" placeholder="Поиск по заданиям: тетрадь, глаголы…" aria-label="Поиск по заданиям">
      <div id="hw-list"></div>
    </section>
  </main>

  <main id="view-dictionary" class="body single" hidden></main>

  <script src="app.js"></script>
</body>
</html>
