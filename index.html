<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ελληνικά · Группа 5</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
</head>
<body>
  <header class="top">
    <strong class="brand">Ελληνικά · Группа 5</strong>
    <nav class="tabs">
      <a class="tab" id="tab-lessons" href="#/lessons">Уроки</a>
      <a class="tab" id="tab-dictionary" href="#/dictionary">Словарь</a>
    </nav>
    <span class="updated" id="updated"></span>
  </header>

  <div class="seg" id="seg" role="tablist" aria-label="Разделы">
    <button class="seg-btn" data-pane="toc" role="tab">Темы</button>
    <button class="seg-btn" data-pane="article" role="tab">Грамматика</button>
    <button class="seg-btn" data-pane="hw" role="tab">Задания</button>
  </div>

  <main id="view-lessons" class="body lessons" data-pane="toc">
    <nav class="pane toc" id="toc-pane" aria-label="Оглавление грамматики">
      <input type="search" id="search" class="search" placeholder="Поиск: σε, артикль, είμαι…" aria-label="Поиск по грамматике">
      <div id="topic-list"></div>
    </nav>
    <div class="gutter" data-gutter="toc" role="separator" aria-orientation="vertical" aria-label="Ширина оглавления" tabindex="0"></div>
    <section class="pane" id="grammar-pane">
      <p class="hint" id="article-hint">Выберите тему слева</p>
      <article id="article" class="article" hidden></article>
    </section>
    <div class="gutter" data-gutter="article" role="separator" aria-orientation="vertical" aria-label="Ширина грамматики" tabindex="0"></div>
    <section class="pane" id="hw-pane">
      <input type="search" id="hw-search" class="search" placeholder="Поиск по заданиям: тетрадь, глаголы…" aria-label="Поиск по заданиям">
      <div id="hw-list"></div>
    </section>
  </main>

  <main id="view-dictionary" class="body single" hidden></main>

  <script src="app.js?v=2"></script>
</body>
</html>
